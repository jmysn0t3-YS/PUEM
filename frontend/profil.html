<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BUMDES</title>

    <!-- REMIX ICON -->
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/profil.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <!-- LOGO -->
        <div class="logo-box">

            <div class="logo-icon">
                <i class="ri-government-line"></i>
            </div>

            <div class="logo-text">
                <h2>BUMDES</h2>
                <p>Sistem Monitoring</p>
            </div>

        </div>

        <!-- MENU -->
        <ul class="menu">

            <li>
                <a href="index.html">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="bumdes.html">
                    <i class="ri-building-line"></i>
                    <span>BUMDES</span>
                </a>
            </li>

            <li>
                <a href="wilayah.html">
                    <i class="ri-map-pin-line"></i>
                    <span>Wilayah</span>
                </a>
            </li>

            <li class="active">
                <a href="profil.html">
                    <i class="ri-user-3-line"></i>
                    <span>Profil</span>
                </a>
            </li>

            <li id="menu-admin">
                <a href="admin.html">
                    <i class="ri-shield-user-line"></i>
                    <span>Admin</span>
                </a>
            </li>

            <li>
                <a href="#" id="exportdata">
                    <i class="ri-download-cloud-line"></i>
                    <span>Export</span>
                </a>
            </li>
        </ul>
        <!-- BOTTOM -->
        <div class="sidebar-bottom">

            <div class="divider"></div>

            <div class="bottom-item" id="logout-btn">
                <i class="ri-logout-box-r-line"></i>
                <span>Logout</span>
            </div>

        </div>


    </aside>

    <!-- MAIN -->
    <div class="main-wrapper">

        <!-- NAVBAR -->
        <header class="navbar">

            <div class="left-nav">

                <button
                    class="menu-btn"
                    onclick="toggleSidebar()"
                >
                    <i class="ri-menu-line"></i>
                </button>

                <h3> DATA PENGUNA</h3>

            </div>

        </header>

        <!-- CONTENT -->
        <main class="content">

            <div class="profile-container">

                <div class="profile-header">

                    <div class="profile-avatar">
                        <i class="ri-user-3-line"></i>
                    </div>

                </div>

                <div class="profile-section">

                    <h3>Informasi Akun</h3>

                    <div class="profile-info">

                        <div class="info-item">
                            <div class="info-label">
                                Username
                            </div>

                            <div class="info-value" id="profile-username">
                                -
                            </div>
                        </div>

                        <div class="info-item">
                            <div class="info-label">
                                Role
                            </div>

                            <div class="info-value" id="info-role">
                                -   
                            </div>
                        </div>

                    </div>

                    <div class="profile-actions">

                        <button class="btn-primary">
                            <i class="ri-user-settings-line"></i>
                            Edit Username
                        </button>

                        <button class="btn-warning">
                            <i class="ri-lock-password-line"></i>
                            Ganti Password
                        </button>

                    </div>
                   
                   
                    <div class="profile-card-form hidden" id="profileCardForm">

                        <div class="form-box">

                            <div class="card-header">
                                <h3 id="form-title">Edit Username</h3>
                                <span class="close" id="closeForm">&times;</span>
                            </div>



                            <!-- FORM EDIT USERNAME -->
                            <div class="form-section" id="edit-username-section">

                                <div class="input-group">
                                    <i class="ri-user-line"></i>
                                    <input
                                        type="text"
                                        id="new-username"
                                        placeholder="Masukkan username baru"
                                    >
                                </div>

                                <button id="save-username">
                                    <i class="ri-save-line"></i>
                                    Simpan Username
                                </button>

                            </div>

                            <!-- FORM GANTI PASSWORD -->
                            <div class="form-section hidden" id="change-password-section">

                                <!-- STEP 1 -->
                                <div id="step-verify">
                                    <div class="input-group">
                                        <i class="ri-lock-line"></i>
                                        <input
                                            type="password"
                                            id="old-password"
                                            placeholder="Masukkan password lama"
                                        >
                                         <i class="ri-eye-line toggle-password" data-target="old-password"></i>
                                    </div><br>

                                    <button id="verify-password">
                                        <i class="ri-check-line"></i>
                                        Konfirmasi Password
                                    </button>
                                </div>

                                <!-- STEP 2 -->
                                <div id="step-new" class="hidden">
                                    <div class="input-group">
                                        <i class="ri-lock-password-line"></i>
                                        <input
                                            type="password"
                                            id="new-password"
                                            placeholder="Password baru"
                                        >
                                         <i class="ri-eye-line toggle-password" data-target="old-password"></i>
                                    </div><br>

                                    <div class="input-group">
                                        <i class="ri-shield-check-line"></i>
                                        <input
                                            type="password"
                                            id="confirm-password"
                                            placeholder="Konfirmasi password"
                                        >
                                         <i class="ri-eye-line toggle-password" data-target="old-password"></i>
                                    </div><br>

                                    <button id="update-password">
                                        <i class="ri-lock-password-line"></i>
                                        Ubah Password
                                    </button>
                                </div>

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </main>

        <!-- FOOTER -->
        <footer class="footer">

            <div>
                © 2026 <b>BUMDES</b> - Sistem Monitoring Desa
            </div>

            <div>
                Versi 1.0.0
            </div>

        </footer>

    </div>

</div>

<div id="toast" class="toast"></div> 


<script type="module" src="assets/js/profil/profil.js"></script>

<!-- Script Export data -->
<script type="module" src="assets/js/export/export.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module">

import {
    logout,
    isLogin
} from "./assets/js/auth.js";

/* CHECK LOGIN */
if(!isLogin()){

    window.location.replace(
        "/login.html"
    );
}

/* TOGGLE SIDEBAR */
function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("hide");
}

window.toggleSidebar =
    toggleSidebar;

/* LOGOUT */
const logoutBtn =
    document.getElementById(
        "logout-btn"
    );

logoutBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        const confirmLogout =
            confirm(
                "Apakah yakin ingin keluar?"
            );

        if(confirmLogout){

            logout();
        }
    }
);

</script>

</body>
</html>
