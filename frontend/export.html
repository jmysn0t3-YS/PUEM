<script type="module" src="assets/js/export/export.js"></script>

<script type="module">

import {
    logout,
    isLogin
} from "./assets/js/auth.js";

/* CHECK LOGIN */
if(!isLogin()){

    window.location.replace(
        "/login.html"
    );
}

/* TOGGLE SIDEBAR */
function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("hide");
}

window.toggleSidebar =
    toggleSidebar;

/* LOGOUT */
const logoutBtn =
    document.getElementById(
        "logout-btn"
    );

logoutBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        const confirmLogout =
            confirm(
                "Apakah yakin ingin keluar?"
            );

        if(confirmLogout){

            logout();
        }
    }
);

</script>
