<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="assets/css/login.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</head>
    <!-- TOAST -->
    <div id="toast"></div>
    <!-- Body -->
    <body class="login-page">

        <div id="toast"></div>

        <div class="overlay">

            <div class="login-box"> 

                <h2>LOGIN BUMDES</h2>

                <form id="login-form">

                    <div class="input-group">
                        <i class="ri-user-line"></i>

                        <input
                            id="username"
                            type="text"
                            placeholder="Username"
                        >
                    </div>

                    <div class="input-group">

                        <i class="ri-lock-line"></i>

                        <input
                            id="password"
                            type="password"
                            placeholder="Password"
                        >

                        <i
                            id="toggle-password"
                            class="ri-eye-off-line password-toggle"
                        ></i>

                    </div>

                    <button type="submit">
                        Login
                    </button>

                </form>

            </div>

        </div>

        <script type="module" src="assets/js/login/login.js"></script>
        <script type="module" src="assets/js/login/toast.js"></script>

    </body>
</html>
